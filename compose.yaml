name: storesync

# Secrets come from an env file that scripts/up.sh generates outside the repo; nothing here has a default.
# Published ports bind to 127.0.0.1 only: 8980 API, 8981 token issuer (stand-in IdP).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storesync
      POSTGRES_USER: storesync
      POSTGRES_PASSWORD: ${STORESYNC_DB_PASSWORD:?run scripts/up.sh or set STORESYNC_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storesync -d storesync"]
      interval: 3s
      retries: 40
    volumes:
      - db:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - kafka:/var/lib/kafka/data

  # Barcode lookup cache only; the app keeps working (slower) if it is down.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Stand-in identity provider: any client_id becomes the token subject. Demo only.
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8981:8080"

  app:
    build: .
    image: storesync:local
    restart: on-failure:3
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      oauth: { condition: service_started }
    environment:
      STORESYNC_PORT: 8980
      STORESYNC_DB_URL: jdbc:postgresql://db:5432/storesync
      STORESYNC_DB_PASSWORD: ${STORESYNC_DB_PASSWORD}
      STORESYNC_KAFKA: kafka:9092
      STORESYNC_REDIS_HOST: redis
      STORESYNC_ISSUER: http://oauth:8080/storesync
      STORESYNC_ADMIN_SUBJECTS: ${STORESYNC_ADMIN_SUBJECTS:-admin@storesync.example.test}
      JAVA_TOOL_OPTIONS: -Xmx640m -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8980:8980"

volumes:
  db:
  kafka:
